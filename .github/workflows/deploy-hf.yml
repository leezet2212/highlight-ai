# Mỗi lần đẩy code lên main: đẩy toàn bộ repo sang Hugging Face Space để web tự
# cập nhật. Cần cấu hình 1 lần trong GitHub repo:
#   Settings → Secrets and variables → Actions
#     - Secret   HF_TOKEN : token Hugging Face quyền "Write"
#     - Variable HF_SPACE : tên Space, ví dụ  ten-cua-ban/highlight-ai
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "::error::Thiếu secret HF_TOKEN"; exit 1; }
          mkdir /tmp/space
          git archive HEAD | tar -x -C /tmp/space
          cd /tmp/space
          # The Space needs YAML config at the top of its README.
          cat deploy/hf-header.md README.md > README.tmp && mv README.tmp README.md
          rm -rf deploy .github CLAUDE.md
          git init -q -b main
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Đã cập nhật: https://huggingface.co/spaces/${HF_SPACE}"
