# Đưa app lên web (Hugging Face Space) mỗi lần đẩy code lên main.
# Chỉ cần cấu hình 1 lần trong GitHub repo: Settings → Secrets and variables → Actions → Secrets
#   HF_TOKEN            token Hugging Face quyền "Write"     (bắt buộc)
#   GEMINI_API_KEY      key Gemini                           (bắt buộc để AI viết lời bình)
#   APP_PASSWORD        mật khẩu vào trang web, tự đặt        (nên có)
#   ELEVENLABS_API_KEY  key ElevenLabs                       (không bắt buộc)
# Space được tạo tự động tên <tài-khoản-hf>/highlight-ai. Muốn tên khác: thêm
# Variable HF_SPACE = ten-tai-khoan/ten-space.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q "huggingface_hub>=0.24"
      - name: Create Space, sync secrets, upload code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python deploy/deploy_hf.py
